[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multipath-robotics"
version = "0.1.0"
description = "Interaction-anchored physics-verified trajectory generation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "daqp>=0.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
planning = ["torch>=2.1", "pyyaml>=6"]

[project.scripts]
multipath = "multipath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
